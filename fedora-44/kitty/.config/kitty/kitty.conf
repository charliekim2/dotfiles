editor nvim

# fish as the default shell for new windows/tabs (login shell is still bash)
shell /usr/bin/fish

# WINDOW
window_padding_width 4
hide_window_decorations no
enabled_layouts vertical

# FONTS
font_size 12.0

# BACKGROUND
background_image_layout cscaled
background_tint 1

# CURSOR
cursor_shape block
shell_integration no-cursor

# KEYBINDS
map alt+r load_config_file
# macos_option_as_alt: macOS-only directive, dropped on Fedora

# BEGIN_KITTY_THEME
# GitHub Dark
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
